<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1c15"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>

  <!-- lightning bolt, neon green, glowing -->
  <path
    d="M35 8 L18 34 H29 L26 56 L46 28 H34 Z"
    fill="#34d399"
    filter="url(#glow)"
  />
</svg>
